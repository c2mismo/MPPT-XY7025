; PlatformIO Configuration for XY7025 ReadWrite Example
; Simple configuration for Arduino UNO

[platformio]
default_envs = uno
src_dir = examples/ReadWrite

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps = 
    4-20ma/ModbusMaster@^2.0.1
lib_extra_dirs = 
    lib
monitor_speed = 115200
upload_port = /dev/ttyACM0
board_build.f_cpu = 16000000L
board_build.mcu = atmega328p
build_flags = 
    -D ARDUINO_ARCH_AVR
    -D ARDUINO_AVR_UNO
build_unflags = 
    -std=gnu++11
