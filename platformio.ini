; PlatformIO Configuration for XY7025 MPPT Project
; Optimized for Arduino UNO with XY7025 Modbus communication

[platformio]
default_envs = uno_xy7025_baudrate
src_dir = examples/ReadBaudrateMemory

; Environment principal para XY7025_Address_Finder
[env:uno_xy7025_baudrate]
platform = atmelavr
board = uno
framework = arduino
lib_deps = 
    4-20ma/ModbusMaster@^2.0.1
lib_extra_dirs = 
    lib
monitor_speed = 115200
monitor_filters = 
    default
    time
    colorize
build_src_filter = +<*> -<.git/> -<.svn/>
upload_speed = 115200
upload_port = /dev/ttyUSB0
board_build.f_cpu = 16000000L
board_build.mcu = atmega328p
build_flags = 
    -D SERIAL_DEBUG=1
    -D DEBUG_MODE=1
    -D XY7025_DEBUG=1
    -D SOFTWARE_SERIAL_BUFFER_SIZE=64
    -D MODBUS_MASTER_TIMEOUT=1000
    -D MODBUS_MASTER_RETRIES=3
    -D ARDUINO_ARCH_AVR
    -D ARDUINO_AVR_UNO
    -Wall
    -Wextra
    -Os
    -ffunction-sections
    -fdata-sections
    -flto
build_unflags = 
    -std=gnu++11
build_type = release

