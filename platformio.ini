; Configuración común para todos los entornos
[env]
lib_ldf_mode = deep
lib_compat_mode = strict
check_tool = cppcheck
check_flags = 
    cppcheck: --enable=all --suppress=missingIncludeSystem
test_framework = unity
test_ignore = 
    test/test_hardware
    test/test_integration
